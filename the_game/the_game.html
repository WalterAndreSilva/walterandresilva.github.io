<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perdí The Game - Estadísticas</title>
    <!-- Librería externa Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Enlace a la hoja de estilos externa -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <!-- BARRA DE USUARIO (AUTH GOOGLE) -->
        <div id="auth-section">
            <button id="btn-login" class="btn-google">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Identificarse con Google
            </button>
            <div id="user-info" class="oculto">
                <img id="user-pic" src="" alt="Foto">
                <span id="user-name">Usuario</span>
                <button id="btn-logout" class="btn-secundario">Salir</button>
            </div>
        </div>

        <h1>THE GAME</h1>

        <!-- Caja dinámica de mensaje según si pasó 1 hora o no -->
        <div id="mensaje-estado">Verificando tu estado...</div>

        <div id="contador">Cargando...</div>

        <div class="charts-grid">
            <div class="chart-box">
                <h3>Pérdidas - Última Hora (por intervalos de 10 min)</h3>
                <canvas id="chartHora"></canvas>
            </div>
            <div class="chart-box">
                <h3>Pérdidas - Últimas 24 Horas (por hora)</h3>
                <canvas id="chart24Horas"></canvas>
            </div>
        </div>

        <div class="historial-grid">
            <!-- 1. Historial Personal del Usuario -->
            <div class="historial-box">
                <h3>👤 Tus pérdidas registradas</h3>
                <div id="lista-historial-usuario">
                    <p class="cargando">Inicia sesión con Google para ver tu historial.</p>
                </div>
            </div>

            <!-- 2. Historial Global Reciente (Top 10) -->
            <div class="historial-box">
                <h3>🌍 Últimos 10 en perder (Global)</h3>
                <div id="lista-historial-global">
                    <p class="cargando">Cargando registro global...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Enlace al archivo JavaScript como módulo para soportar los imports -->
    <script type="module" src="script.js"></script>
</body>
</html>
